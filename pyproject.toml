[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rosclaw-soccer"
version = "0.1.0.dev0"
description = "Evidence-driven academy for growing self-improving humanoid footballers"
readme = "README.md"
# Isaac Sim 5.1 is distributed for CPython 3.11.  ROSClaw Core also supports
# 3.11, and Soccer avoids 3.12-only syntax so one source tree can serve both
# the lightweight CPU evidence environment and the official GPU simulator.
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "ROSClaw Contributors" }]
dependencies = [
  "mujoco>=3.3",
  "numpy>=1.26,<2.4",
  "rosclaw",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.8",
]
training = ["onnxruntime>=1.18"]

[project.entry-points."rosclaw.cli_extensions"]
soccer = "rosclaw_soccer.plugin:register_cli"

[project.entry-points."rosclaw.growth.adapters"]
soccer = "rosclaw_soccer.growth.adapter:SOCCER_GROWTH_ADAPTER"

[project.entry-points."rosclaw.simforge.tasks"]
soccer = "rosclaw_soccer.sim.tasks:SOCCER_TASK_PROVIDER"

[project.entry-points."rosclaw.dataset.sources"]
g1-retargeted-motions = "rosclaw_soccer.data.sources:G1_RETARGETED_MOTIONS_SOURCE"
motiondecode = "rosclaw_soccer.data.sources:MOTIONDECODE_SOURCE"
omnicontact = "rosclaw_soccer.data.sources:OMNICONTACT_SOURCE"

[project.urls]
Repository = "https://github.com/ros-claw/rosclaw-soccer"
Issues = "https://github.com/ros-claw/rosclaw-soccer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rosclaw_soccer"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: runs a bounded simulator integration check"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rosclaw_soccer"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mujoco.*", "onnxruntime.*", "rosclaw.*"]
ignore_missing_imports = true

# PyTorch is an intentionally optional, GPU-host-only training dependency.
# Runtime/evidence readers remain NumPy-only; these modules import torch only
# inside explicitly invoked training or extraction functions.
[[tool.mypy.overrides]]
module = [
  "rosclaw_soccer.skills.goalkeeper_v2.external_reference",
  "rosclaw_soccer.skills.team.agility_evidence",
  "rosclaw_soccer.skills.team.composite_imitation_evidence",
  "rosclaw_soccer.skills.team.development_evidence",
  "rosclaw_soccer.skills.team.follow_through_evidence",
  "rosclaw_soccer.skills.team.goalkeeper_evidence",
  "rosclaw_soccer.skills.team.imitation_evidence",
  "rosclaw_soccer.growth.opentrack_tracking",
  "rosclaw_soccer.training.dynamic_lead_pass_evidence",
  "rosclaw_soccer.training.recovery_student_stateful_train",
  "rosclaw_soccer.training.recovery_student_train",
  "rosclaw_soccer.training.dive_athlete_cpu_exam",
  "rosclaw_soccer.training.dive_athlete_expert",
  "rosclaw_soccer.training.high_corner_reachability_audit",
  "rosclaw_soccer.training.lateral_athlete_cpu_exam",
  "rosclaw_soccer.training.lateral_athlete_expert",
  "rosclaw_soccer.training.opentrack_teacher_source_exam",
]
disable_error_code = ["import-not-found"]

[[tool.mypy.overrides]]
module = [
  "rosclaw_soccer.growth.mjlab_getup",
  "rosclaw_soccer.growth.mosaic_gmt",
  "rosclaw_soccer.media.physics_goalkeeper_video",
  "rosclaw_soccer.skills.athlete_foundation.full_body_goalkeeper_motion",
  "rosclaw_soccer.skills.goalkeeper_v2.external_motion",
  "rosclaw_soccer.training.goalkeeper_agility",
  "rosclaw_soccer.training.goalkeeper_combat_curriculum",
  "rosclaw_soccer.training.goalkeeper_combat_mjwarp",
  "rosclaw_soccer.training.goalkeeper_combat_teacher",
  "rosclaw_soccer.training.goalkeeper_consolidation",
  "rosclaw_soccer.training.goalkeeper_cpu_exam",
  "rosclaw_soccer.training.goalkeeper_dive_memory",
  "rosclaw_soccer.training.goalkeeper_mobility_option",
  "rosclaw_soccer.training.goalkeeper_mjwarp",
  "rosclaw_soccer.training.goalkeeper_multistep_torch",
  "rosclaw_soccer.training.goalkeeper_physics_ppo",
  "rosclaw_soccer.training.goalkeeper_ppo",
  "rosclaw_soccer.training.goalkeeper_reach",
  "rosclaw_soccer.training.goalkeeper_targeted_dive",
  "rosclaw_soccer.training.goalkeeper_targeted_dive_actor_exam",
  "rosclaw_soccer.training.goalkeeper_targeted_dive_exam",
  "rosclaw_soccer.training.goalkeeper_targeted_dive_mjwarp",
  "rosclaw_soccer.training.goalkeeper_teacher",
  "rosclaw_soccer.training.joint_guard",
  "rosclaw_soccer.training.mjlab_getup_probe",
  "rosclaw_soccer.training.mosaic_getup_probe",
  "rosclaw_soccer.training.mosaic_gmt_goalkeeper_probe",
  "rosclaw_soccer.training.opentrack_recovery_mjx_ppo",
  "rosclaw_soccer.training.opentrack_recovery_mjx_teacher_ppo",
  "rosclaw_soccer.training.opentrack_recovery_mjx_failure_collect",
  "rosclaw_soccer.training.opentrack_recovery_mjx_failure_exam",
  "rosclaw_soccer.training.opentrack_recovery_corrective_teacher",
  "rosclaw_soccer.training.opentrack_recovery_corrective_student",
  "rosclaw_soccer.training.recovery_snapshot_collector",
  "rosclaw_soccer.training.recovery_snapshot_exam",
  "rosclaw_soccer.training.recovery_snapshot_settler",
]
disable_error_code = [
  "import-not-found",
  "misc",
  "no-untyped-call",
  "no-untyped-def",
  "untyped-decorator",
  "unused-ignore",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
