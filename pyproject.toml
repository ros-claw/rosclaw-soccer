[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rosclaw-soccer"
version = "0.1.0.dev0"
description = "Evidence-driven academy for growing self-improving humanoid footballers"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "ROSClaw Contributors" }]
dependencies = [
  "mujoco>=3.3",
  "numpy>=1.26,<2.4",
  "rosclaw",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.8",
]
training = ["onnxruntime>=1.18"]

[project.entry-points."rosclaw.cli_extensions"]
soccer = "rosclaw_soccer.plugin:register_cli"

[project.entry-points."rosclaw.growth.adapters"]
soccer = "rosclaw_soccer.growth.adapter:SOCCER_GROWTH_ADAPTER"

[project.entry-points."rosclaw.simforge.tasks"]
soccer = "rosclaw_soccer.sim.tasks:SOCCER_TASK_PROVIDER"

[project.entry-points."rosclaw.dataset.sources"]
g1-retargeted-motions = "rosclaw_soccer.data.sources:G1_RETARGETED_MOTIONS_SOURCE"
motiondecode = "rosclaw_soccer.data.sources:MOTIONDECODE_SOURCE"
omnicontact = "rosclaw_soccer.data.sources:OMNICONTACT_SOURCE"

[project.urls]
Repository = "https://github.com/ros-claw/rosclaw-soccer"
Issues = "https://github.com/ros-claw/rosclaw-soccer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rosclaw_soccer"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["integration: runs a bounded simulator integration check"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rosclaw_soccer"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mujoco.*", "onnxruntime.*", "rosclaw.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
